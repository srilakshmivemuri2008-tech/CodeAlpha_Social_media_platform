{% extends 'social/base.html' %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="muted">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
</div>
{% endblock %}
