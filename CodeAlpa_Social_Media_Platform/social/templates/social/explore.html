{% extends 'social/base.html' %}
{% block title %}Explore{% endblock %}

{% block content %}
<h2>Explore people</h2>
<div class="user-grid">
    {% for u in users %}
        <div class="card user-card">
            <img src="{{ u.avatar_url|default:'https://api.dicebear.com/7.x/identicon/svg?seed='|add:u.username }}"
                 alt="avatar" class="avatar-sm">
            <a href="{% url 'profile' u.username %}"><strong>{{ u.username }}</strong></a>
            <p class="muted">{{ u.bio|default:"" }}</p>
            <a href="{% url 'profile' u.username %}" class="btn btn-secondary">View profile</a>
        </div>
    {% empty %}
        <p class="empty-state">No other users yet — invite some friends!</p>
    {% endfor %}
</div>
{% endblock %}
